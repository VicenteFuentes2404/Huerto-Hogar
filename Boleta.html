<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boleta - Huerto Hogar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="HeaderPrincipal">   
    <nav class="navbar ms-5">
      <div class="container-fluid d-flex align-items-center">
        <div>
          <a class="navbar-icono" href="Nosotros.html">
            <img src="assets/img/logo2.png" alt="Logo" height="40" class="d-inline-block align-text-top">
          </a>
        </div>

        <div>
          <ul class="nav ms-5">
            <li class="nav-item"><a class="nav-link linea1" href="/HomePrincipalTienda.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link linea1" href="Producto.html">Productos</a></li>
            <li class="nav-item"><a class="nav-link linea1" href="Nosotros.html">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link linea1" href="/blogs.html">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>

        <div class="ms-auto me-5">
          <ul class="nav">
            <li class="nav-item"><a class="nav-link" href="/carrito.html"><i class="bi bi-cart4"></i></a></li>
            <li class="nav-item me-0"><a class="nav-link" href="Login.html">Iniciar Sesión</a></li>
            <li class="nav-item"><a class="nav-link" href="registroUsuario.html">Registrarse</a></li>
          </ul>
        </div>
      </div>  
    </nav>   
  </header>

  <!-- MAIN -->
  <main>
    <div class="container my-5">
      <h1 class="text-center mb-4">Boleta Electrónica</h1>

      <div class="card p-4 shadow-sm" style="max-width: 600px; margin: 0 auto; border-top: 4px solid rgb(158, 190, 169);">
        <div class="text-center mb-4">
          <p><strong>Huerto Hogar</strong></p>
          <p>RUT: 76.543.210-1</p>
          <p>Fecha: <span id="fechaBoleta"></span></p>
          <p>N° Boleta: <span id="numBoleta"></span></p>
        </div>

        <table class="table table-sm">
          <thead>
            <tr>
              <th>Producto</th>
              <th class="text-center">Cant.</th>
              <th class="text-end">Precio</th>
            </tr>
          </thead>
          <tbody id="detalleBoleta">
            <!-- Aquí se insertan los productos con JS -->
          </tbody>
        </table>

        <div class="d-flex justify-content-between mt-3">
          <span>Subtotal</span>
          <span id="subtotalBoleta">$0</span>
        </div>
        <div class="d-flex justify-content-between">
          <span>Descuento</span>
          <span id="descuentoBoleta">$0</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5">
          <span>Total</span>
          <span id="totalBoleta">$0</span>
        </div>

        <div class="text-center mt-4">
          <button class="btn btn-success w-75" onclick="window.print()">Imprimir Boleta</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-enlaces">
      <a href="#">Frutas</a> |
      <a href="#">Verduras</a> |
      <a href="#">Orgánicos</a>
    </div>

    <div class="footer-formulario">
      <form id="formBoletin">
        <label for="email">Suscríbete al boletín:</label>
        <input type="email" id="emailBoletin" placeholder="Tu correo" required />
        <button type="submit" class="boton">Suscribirse</button>
      </form>
      <p id="mensajeSuscripcion" class="mensaje"></p>
    </div>

    <p class="copy">© 2025 Huerto Hogar</p>
  </footer>

  <!-- JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Datos simulados (pueden venir del carrito real con localStorage o backend)
      const productos = [
        { nombre: "Manzanas Fuji", cantidad: 1, precio: 1200 },
        { nombre: "Naranjas Valencia", cantidad: 1, precio: 1000 },
        { nombre: "Plátanos Cavendish", cantidad: 1, precio: 800 },
        { nombre: "Zanahorias Orgánicas", cantidad: 1, precio: 900 }
      ];

      const descuento = 0; // si usaste un cupón, aquí se puede aplicar
      const tbody = document.getElementById("detalleBoleta");
      let subtotal = 0;

      productos.forEach(item => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${item.nombre}</td>
          <td class="text-center">${item.cantidad}</td>
          <td class="text-end">$${item.precio.toLocaleString()}</td>
        `;
        tbody.appendChild(fila);
        subtotal += item.precio * item.cantidad;
      });

      document.getElementById("subtotalBoleta").textContent = `$${subtotal.toLocaleString()}`;
      document.getElementById("descuentoBoleta").textContent = `$${descuento.toLocaleString()}`;
      document.getElementById("totalBoleta").textContent = `$${(subtotal - descuento).toLocaleString()}`;

      // Fecha y número aleatorio de boleta
      const fecha = new Date().toLocaleString("es-CL");
      document.getElementById("fechaBoleta").textContent = fecha;
      document.getElementById("numBoleta").textContent = Math.floor(Math.random() * 1000000);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
